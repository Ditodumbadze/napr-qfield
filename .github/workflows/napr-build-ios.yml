---
# Georgia QField — builds an UNSIGNED iPhone app (.ipa) of QField v4.3.3 with the
# NAPR patch. Install it on the iPhone with Sideloadly (Windows), which signs it
# with your own Apple ID. Run it from the Actions tab ("Run workflow").
name: 🍏 Georgia QField iOS
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  QFIELD_VERSION: v4.3.3
  CUSTOM_APP_NAME: Georgia QField
  NIGHTLY_PACKAGE_NAME: ch.opengis.napr_qfield
  BUNDLE_ID: ge.georgiaqfield.app

jobs:
  build:
    name: build (ios)
    runs-on: macos-15
    timeout-minutes: 360
    env:
      DEPLOYMENT_TARGET: '17.0'
      BUILD_TYPE: 'Release'
      TRIPLET: 'arm64-ios'
      IOS_SDK: '26.2'

    steps:
      - name: 🐣 Checkout QField ${{ env.QFIELD_VERSION }}
        uses: actions/checkout@v7.0.1
        with:
          repository: opengisch/QField
          ref: ${{ env.QFIELD_VERSION }}
          submodules: recursive

      - name: 📥 Checkout NAPR patch (this repository)
        uses: actions/checkout@v7.0.1
        with:
          path: napr-src

      - name: 🩹 Apply NAPR patch
        run: |
          git apply --verbose napr-src/napr-qfield-4.3.3.patch
          # Bundle the default Georgia project (qgz + gpkg) if it is in the repository
          if [ -d napr-src/georgia-project ]; then
            mkdir -p resources/sample_projects/georgia
            cp -rv napr-src/georgia-project/. resources/sample_projects/georgia/
          fi
          rm -rf napr-src
          # A free Apple ID cannot sign the NFC capability: drop the entitlement
          cat > platform/ios/qfield.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict/>
          </plist>
          PLIST

      - name: 🌾 Prepare variables
        id: vars
        run: |
          ./scripts/ci/env_gh.sh
          # Our own bundle id (the QField one belongs to OPENGIS.ch's Apple team)
          echo "IOS_APP_IDENTIFIER=${{ env.BUNDLE_ID }}" >> $GITHUB_ENV

      - name: 💎 Setup ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: '3.4' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically

      - name: 🍭 Setup XCode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: ${{ env.IOS_SDK }}

      - name: 🍹 Prepare ios build env
        run: |
          xcrun simctl list | grep iOS
          # xcodebuild -downloadPlatform iOS -buildVersion ${{ env.IOS_SDK }} -architectureVariant universal
          brew uninstall cmake
          # Workaround GitHub Actions Python issues
          brew unlink python && brew link --overwrite python
          brew install automake bison flex gnu-sed s3cmd gettext autoconf-archive nasm libtool mono
          echo $(brew --prefix bison)/bin >> $GITHUB_PATH
          echo $(brew --prefix flex)/bin >> $GITHUB_PATH
          echo $(brew --prefix s3cmd)/bin >> $GITHUB_PATH
          echo $(brew --prefix gettext)/bin >> $GITHUB_PATH
          echo $(brew --prefix autoconf-archive)/bin >> $GITHUB_PATH
          echo $(brew --prefix libtool)/bin >> $GITHUB_PATH

      - name: 🐩 Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12.3'

      - name: 🌱 Install dependencies and generate project files
        run: |
          source ./scripts/version_number.sh
          source ./scripts/ci/generate-version-details.sh

          # Unset ALL Apple platform deployment target env vars injected by Xcode 26+
          unset IPHONEOS_DEPLOYMENT_TARGET
          unset MACOSX_DEPLOYMENT_TARGET
          unset XROS_DEPLOYMENT_TARGET
          unset TVOS_DEPLOYMENT_TARGET
          unset WATCHOS_DEPLOYMENT_TARGET
          unset DRIVERKIT_DEPLOYMENT_TARGET

          cmake -S "${{ github.workspace }}" \
                -B "/Users/runner/builddir" \
                -G "Xcode" \
                -D CMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
                -D VCPKG_TARGET_TRIPLET="${{ env.TRIPLET }}" \
                -D VCPKG_HOST_TRIPLET="arm64-osx" \
                -D WITH_VCPKG=ON \
                -D WITH_SPIX=OFF \
                -D WITH_BLUETOOTH=ON \
                -D WITH_SERIALPORT=OFF \
                -D APP_VERSION="${APP_VERSION}" \
                -D APK_VERSION_CODE="${APK_VERSION_CODE}" \
                -D APP_VERSION_STR="${APP_VERSION_STR}" \
                -D APP_PACKAGE_NAME="${APP_PACKAGE_NAME}" \
                -D APP_NAME="${APP_NAME}" \
                -D NUGET_USERNAME=opengisch \
                -D NUGET_TOKEN=${{ secrets.GITHUB_TOKEN }} \
                -D SENTRY_ENV="${APP_ENV}" \
                -D ENABLE_BITCODE=OFF \
                -D ENABLE_ARC=ON \
                -D IOS_APP_IDENTIFIER="${{ env.BUNDLE_ID }}" \
                -D CMAKE_SYSTEM_NAME=iOS \
                -D CMAKE_SYSTEM_PROCESSOR=aarch64 \
                -D CMAKE_OSX_DEPLOYMENT_TARGET=${{ env.DEPLOYMENT_TARGET }} \
                -D CMAKE_XCODE_ATTRIBUTE_IPHONEOS_DEPLOYMENT_TARGET=${{ env.DEPLOYMENT_TARGET }} \
                -D ENABLE_TESTS=OFF \
                -D CMAKE_CXX_VISIBILITY_PRESET=hidden \
                -D WITH_CCACHE=OFF \
                -D VCPKG_INSTALL_OPTIONS="--x-abi-tools-use-exact-versions"

      - name: 🔍 Validate vcpkg dependency deployment targets
        run: |
          EXPECTED="${{ env.DEPLOYMENT_TARGET }}"
          LIB_DIR="/Users/runner/builddir/vcpkg_installed/arm64-ios/lib"
          FAILED=0

          for lib in "$LIB_DIR"/*.a; do
            # Extract all object files from the archive and check each one
            # LC_BUILD_VERSION (modern) or LC_VERSION_MIN_IPHONEOS (legacy)
            while IFS= read -r line; do
              VERSION=$(echo "$line" | grep -Eo 'minos [0-9]+\.[0-9]+' | awk '{print $2}')
              if [[ -n "$VERSION" && "$VERSION" != "$EXPECTED" ]]; then
                echo "❌ $(basename $lib): deployment target is $VERSION (expected $EXPECTED)"
                FAILED=1
              else
                echo "$(basename $lib): deployment target is $VERSION"
              fi
            done < <(otool -l "$lib" 2>/dev/null | grep 'minos')
          done

          if [[ $FAILED -eq 0 ]]; then
            echo "✅ All libraries have deployment target $EXPECTED"
          else
            exit 1
          fi

      - name: 📑 Upload Dep Build Logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-logs-${{ env.TRIPLET }}
          path: |
            /Users/runner/builddir/**/*.log

      - name: 🔨 Build (unsigned)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        run: |
          cmake --build /Users/runner/builddir --config Release --target qfield -- \
                CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""

      - name: 📦 Package unsigned IPA (for Sideloadly)
        run: |
          # QField puts the app in builddir/output/bin (no Release-iphoneos subfolder)
          echo "App bundles found:"
          find /Users/runner/builddir -maxdepth 6 -type d -name "*.app" -not -path "*/vcpkg*" -prune -print || true
          APP=$(find /Users/runner/builddir/output/bin -maxdepth 2 -type d -name "*.app" -prune | head -n 1)
          if [ -z "$APP" ]; then
            APP=$(find /Users/runner/builddir -type d -name "*.app" -not -path "*/vcpkg*" -prune | head -n 1)
          fi
          echo "Using app bundle: $APP"
          test -n "$APP"
          test -f "$APP/Info.plist"
          mkdir -p /tmp/ipa/Payload
          cp -R "$APP" /tmp/ipa/Payload/
          cd /tmp/ipa && zip -qry /tmp/Georgia-QField-unsigned.ipa Payload
          ls -la /tmp/Georgia-QField-unsigned.ipa

      - name: 📦 Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Georgia-QField-iOS-ipa
          path: /tmp/Georgia-QField-unsigned.ipa
